[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Testes unitarios das regras de negocio (RN01-RN12)
    integration: Testes de integracao entre os modulos
    regression: Testes de regressao para garantir estabilidade apos mudancas
    e2e: Testes end-to-end de fluxo completo e automacao web